daemon off;
master_process off;
worker_processes 1;
pid /tmp/micro-test.pid;

events {}

http {
    lua_package_path "/t/lib/?.lua;/t/vendor/lua/?.lua;;";
    lua_shared_dict micro_limit 1m;
    lua_shared_dict micro_p2c 1m;

    init_by_lua_block {
        local ok, res = pcall(dofile, "/t/t/runner.lua")
        if not ok then
            io.stderr:write("runner error: ", tostring(res), "\n")
        end
        os.exit((ok and res) and 0 or 1)
    }
}
