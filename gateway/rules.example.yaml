# Example gateway rules - valid for both gateway/proxy and gateway/openresty.
# Schema: rules.schema.json · Semantics: SPEC.md section 9.
version: 1

defaults:
  convention: true            # /<service>.<Handler>/<Method> -> <service>
  timeout: { connect: 1s, send: 10s, read: 10s }
  retries: 2                  # only before the request reached a node
  selector: { strategy: roundrobin }

global:
  plugins:                    # run on every call, before route plugins
    - name: ip-restriction
      config:
        deny: ["203.0.113.0/24"]
    - name: rate-limit
      config: { rate: 100, burst: 50, key: client_ip }

routes:
  # Public, read-only method: no auth, its own tighter limit.
  - name: greeter-hello
    match: { method: /greeter.Greeter/Hello }
    plugins:
      - name: rate-limit
        config: { rate: 10, burst: 5, key: client_ip }

  # Everything else on orders needs a token issued by auth/jwt;
  # 5% of traffic goes to the v2 canary.
  - name: orders
    match: { service: orders }
    upstream:
      selector:
        version_weights: { v1: 95, v2: 5 }
      timeout: { read: 30s }
    plugins:
      - name: jwt-auth
        config:
          public_key: LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0KUkVQTEFDRS1XSVRILVJFQUwtS0VZCi0tLS0tRU5EIFBVQkxJQyBLRVktLS0tLQo=
          scopes: ["orders"]
          forward_claims: { user-id: sub }   # services read metadata "user-id"
      - name: rate-limit
        config: { rate: 50, burst: 20, key: account }

  # Legacy service whose proto package does not match its registry name.
  - name: billing-legacy
    match: { prefix: /billing.v1. }
    upstream:
      service: legacy-billing
      filters:
        labels: { zone: cn-east }

# REST endpoints transcoded to gRPC methods (SPEC.md section 2.2), on the
# HTTP/JSON entry. Generate these from google.api.http annotations with
# cmd/protoc-gen-micro-gateway. Routes and plugins above still apply, by
# the target method.
http_rules:
  - method: GET
    path: /v1/orders/{id}
    target: /orders.Orders/Get
    params: { id: string, with_items: bool }
  - method: POST
    path: /v1/orders
    target: /orders.Orders/Create
    body: "*"

# WebSocket entry (SPEC.md section 2.3): calls, streams, topics and pushes
# over one connection at /ws. Browsers pass the token as ?access_token=.
websocket:
  plugins:
    - name: jwt-auth
      config:
        public_key: LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0KUkVQTEFDRS1XSVRILVJFQUwtS0VZCi0tLS0tRU5EIFBVQkxJQyBLRVktLS0tLQo=
        forward_claims: { user-id: sub }
  topics: ["room.*", "user.{account}.>"]   # {account} = the token's sub
